{"name": "Build NFC kernel", "on": {"workflow_dispatch": {}, "push": {"paths": [".github/workflows/build.yml"]}}, "jobs": {"build": {"runs-on": "ubuntu-22.04", "timeout-minutes": 180, "steps": [{"uses": "actions/checkout@v4", "with": {"submodules": "recursive", "fetch-depth": 1}}, {"name": "Deps", "run": "sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev libelf-dev zip cpio python2 libtinfo5 libncurses5 && sudo ln -sf /usr/bin/python2 /usr/local/bin/python"}, {"name": "Enable NXP NFC (G780G)", "run": "cfg=arch/arm64/configs/wirus_defconfig; for o in SAMSUNG_NFC NFC_PN547 NFC_PN547_ESE_SUPPORT NFC_FEATURE_SN100U; do sed -i \"s/^# CONFIG_$o is not set/CONFIG_$o=y/\" $cfg; done; grep -nE 'NFC|ESE' $cfg; sed -i 's/_v4.1$/_v4.1_nfc/' build.sh; grep -n '^VERSION' build.sh; chmod -R +x toolchain tools/dtc tools/mkdtimg || true; sed -i 's/if m and m.group(2) not in allowed_warnings:/if False:/' scripts/gcc-wrapper.py; grep -n 'if False' scripts/gcc-wrapper.py"}, {"name": "Build", "run": "set -o pipefail; export PATH=$PWD/toolchain/llvm-arm-toolchain-ship/10.0/bin:$PATH; bash build.sh 2>&1 | tee ../build.log; ls -la ../build/r8q; grep -E 'CONFIG_(NFC_PN547|SAMSUNG_NFC|NFC_FEATURE_SN100U)' ../out/.config"}, {"name": "Collect", "if": "always()", "run": "mkdir -p art; cp ../build/r8q/*.zip art/ || true; cp ../build.log art/ || true; cp ../out/.config art/kernel.config || true; tail -n 80 ../build.log || true"}, {"uses": "actions/upload-artifact@v4", "if": "always()", "with": {"name": "kernel-nfc", "path": "art/"}}]}}}
